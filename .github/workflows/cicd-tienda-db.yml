name: CI/CD Tienda Perritos - DB

on:
  push:
    branches: [ "deploy" ]
    paths:
      - "db/**"

jobs:
  build-push-deploy-db:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v3

    - name: Configurar credenciales AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login en Amazon ECR (runner)
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build imagen DB y push a ECR
      run: |
        cd db
        docker build -t tienda-db .
        docker tag tienda-db:latest ${{ secrets.ECR_REPO_URL_DB }}:latest
        docker tag tienda-db:latest ${{ secrets.ECR_REPO_URL_DB }}:v1
        docker tag tienda-db:latest ${{ secrets.ECR_REPO_URL_DB }}:v1.0.0
        docker push ${{ secrets.ECR_REPO_URL_DB }}:latest
        docker push ${{ secrets.ECR_REPO_URL_DB }}:v1
        docker push ${{ secrets.ECR_REPO_URL_DB }}:v1.0.0

    - name: Desplegar DB vía SSM
      run: |
        aws ssm send-command \
          --instance-ids ${{ secrets.EC2_DB_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --comment "Actualizar tienda-db desde ECR" \
          --parameters '{"commands":[
            "set -e",
            "cd /home/ubuntu/tienda-perritos_Docker_y_Workflow_GITHUB",
            "git pull origin deploy",
            "aws ecr get-login-password --region '${{ secrets.AWS_REGION }}' | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}",
            "export DB_IMAGE=${{ secrets.ECR_REPO_URL_DB }}:latest",
            "docker compose pull db",
            "docker compose up -d db"
          ]}' \
          --output text
