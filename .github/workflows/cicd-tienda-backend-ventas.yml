name: CI/CD Tienda Perritos - Backend Ventas

on:
  push:
    branches: [ "deploy" ]
    paths:
      - "backend-ventas/**"
      - ".github/workflows/cicd-tienda-backend-ventas.yml"

jobs:
  build-push-deploy-backend-ventas:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v3

    - name: Configurar credenciales AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login en Amazon ECR
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build imagen Backend Ventas y push a ECR
      run: |
        cd backend-ventas
        docker build -t backend-ventas .
        docker tag backend-ventas:latest ${{ secrets.ECR_REPO_URL_BACKEND }}:ventas-latest
        docker push ${{ secrets.ECR_REPO_URL_BACKEND }}:ventas-latest

    - name: Desplegar Backend Ventas vía SSM (Docker Compose)
      run: |
        aws ssm send-command \
          --instance-ids ${{ secrets.EC2_BACKEND_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --comment "Actualizar backend-ventas desde ECR" \
          --parameters '{"commands":[
            "set -e",
            "cd /home/ubuntu/tienda-perritos_Docker_y_Workflow_GITHUB",
            "git pull origin deploy",
            "aws ecr get-login-password --region '${{ secrets.AWS_REGION }}' | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}",
            "docker compose pull backend-ventas",
            "docker compose up -d backend-ventas"
          ]}' \
          --output text
