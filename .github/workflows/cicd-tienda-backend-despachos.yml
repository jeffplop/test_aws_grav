name: CI/CD Tienda Perritos - Backend Despachos

on:
  push:
    branches: [ "deploy" ]
    paths:
      - "backend-despachos/**"
      - ".github/workflows/cicd-tienda-backend-despachos.yml"

jobs:
  build-push-deploy-backend-despachos:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v3

    - name: Configurar credenciales AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login en Amazon ECR
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build imagen Backend Despachos y push a ECR
      run: |
        cd backend-despachos
        docker build -t backend-despachos .
        docker tag backend-despachos:latest ${{ secrets.ECR_REPO_URL_BACKEND }}:despachos-latest
        docker push ${{ secrets.ECR_REPO_URL_BACKEND }}:despachos-latest

    - name: Desplegar Backend Despachos vía SSM (Docker Compose)
      run: |
        aws ssm send-command \
          --instance-ids ${{ secrets.EC2_BACKEND_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --comment "Actualizar backend-despachos desde ECR" \
          --parameters '{"commands":[
            "set -e",
            "mkdir -p /home/ubuntu/app",
            "cd /home/ubuntu/app",
            "curl -so docker-compose.yml https://raw.githubusercontent.com/jeffplop/test_aws_grav/deploy/docker-compose.yml",
            "aws ecr get-login-password --region '${{ secrets.AWS_REGION }}' | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}",
            "export DESPACHOS_IMAGE=${{ secrets.ECR_REPO_URL_BACKEND }}:despachos-latest",
            "docker compose pull backend-despachos",
            "docker compose up -d backend-despachos"
          ]}' \
          --output text

