version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: tienda_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - tienda_db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-ventas:
    build:
      context: ./backend-ventas
    container_name: tienda_backend_ventas
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_ENDPOINT=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    ports:
      - "8080:8080"
    networks:
      - app-network

  backend-despachos:
    build:
      context: ./backend-despachos
    container_name: tienda_backend_despachos
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_ENDPOINT=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    ports:
      - "8081:8081"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
    container_name: tienda_frontend
    restart: unless-stopped
    depends_on:
      - backend-ventas
      - backend-despachos
    environment:
      - BACKEND_VENTAS_HOST=backend-ventas
      - BACKEND_VENTAS_PORT=8080
      - BACKEND_DESPACHOS_HOST=backend-despachos
      - BACKEND_DESPACHOS_PORT=8081
    ports:
      - "80:8080" # Nginx corre en el 8080 interno
    networks:
      - app-network

volumes:
  tienda_db_data:

networks:
  app-network:
    driver: bridge
